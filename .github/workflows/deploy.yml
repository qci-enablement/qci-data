name: Deploy PR Preview

run-name: Deploying preview for "${{ github.ref }}" by ${{ github.actor }} 🚀

#! WARN: any edit to this file should be done too to: learn-qci/.github/workflows/deploy.yml

on:
  pull_request:
    branches:
      - main

# Two pushes to the same PR used to race each other onto the same Netlify alias, so whichever finished last silently won.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checkout_codebase:
    runs-on: ubuntu-latest
    # 60 while the determinism check runs a second build; drop back to 30 after
    timeout-minutes: 60

    steps:
      # End Output URL
      - name: Checkout QCI learn
        uses: actions/checkout@v4
        with:
          repository: qci-enablement/learn-qci
          #! TEMPORARY: points at the learn-qci fix branch so this PR can test it. Set back to `main` before merging.
          ref: ConfigurationFix
          token: ${{ secrets.P_GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            apps/learn/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: yarn install --frozen-lockfile # optional, --immutable
      - name: Add Loading 
        env:
          GITHUB_TOKEN: ${{ secrets.P_GITHUB_TOKEN }}
          DESC_STATE: loading
        run: node ./.github/workflows/update-description.js
      - name: ESlint
        run: yarn learn lint
      - name: Cache Pandoc Binay
        id: binaycache
        uses: actions/cache@v4
        with:
          path: bin # Path to the binary file
          key: ${{ runner.os }}-binary-${{ hashFiles('bin/**/*') }}
      - name: Install Pandoc
        if: steps.binaycache.outputs.cache-hit != 'true'
        run: bash ./scripts/install-pandoc.sh
      # Clone only. Generated pages/ stays uncached to avoid orphans.
      - name: Cache Data
        id: syncData
        uses: actions/cache@v4
        with:
          path: apps/learn/data/raw/qci-data
          key: ${{ runner.os }}-qcidata-${{ github.head_ref }}
          # New branches start from any existing clone; sync-data refetches.
          restore-keys: |
            ${{ runner.os }}-qcidata-
      - name: Sync data
        run: yarn learn sync-data
        env:
          DEV_ENV: pr
          QCI_DATA_BRANCH_PR: ${{ github.head_ref }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          CONTENTFUL_TOKEN_DEV: ${{ secrets.CONTENTFUL_TOKEN_DEV }}
          CONTENTFUL_TOKEN_PROD: ${{ secrets.CONTENTFUL_TOKEN_PROD }}
      - name: Build website
        run: yarn learn next build
      # TEMPORARY: is next build deterministic given identical input?
      - name: Determinism check
        run: |
          set +e
          cd apps/learn
          find dist -type f -exec sha256sum {} + | sort -k2 > /tmp/a.txt
          mv dist dist_a
          cd "$GITHUB_WORKSPACE"
          yarn learn next build
          cd apps/learn
          if [ ! -d dist ]; then
            echo "Second build produced no dist; restoring build A so the deploy still works."
            mv dist_a dist
            exit 0
          fi
          find dist -type f -exec sha256sum {} + | sort -k2 > /tmp/b.txt

          echo "=== COUNTS ==="
          echo "build A files: $(wc -l < /tmp/a.txt)"
          echo "build B files: $(wc -l < /tmp/b.txt)"

          comm -13 /tmp/a.txt /tmp/b.txt > /tmp/changed.txt
          echo "changed or new in B: $(wc -l < /tmp/changed.txt)"

          echo "=== CHANGED BY TOP-LEVEL DIR ==="
          awk '{print $2}' /tmp/changed.txt | sed 's|^dist/||' | cut -d/ -f1 | sort | uniq -c | sort -rn | head -25

          echo "=== CHANGED BY EXTENSION ==="
          awk '{print $2}' /tmp/changed.txt | sed 's|.*\.||' | sort | uniq -c | sort -rn | head -15

          echo "=== SAMPLE CHANGED FILES ==="
          awk '{print $2}' /tmp/changed.txt | head -8

          echo "=== WHY THEY DIFFER (first 3) ==="
          for f in $(awk '{print $2}' /tmp/changed.txt | head -3); do
            echo "--- $f ---"
            a="dist_a/${f#dist/}"
            if [ -f "$a" ]; then
              diff <(fold -w120 "$a") <(fold -w120 "$f") | head -12
            else
              echo "(new file, no counterpart in build A)"
            fi
          done

          rm -rf dist_a
          exit 0
      # Deploy PR Preview
      # Direct CLI: the docker action swallowed deploy failures
      - name: Deploy PR Preview to Netlify
        id: netlify-pr-preview
        run: npx --yes netlify-cli@17 deploy --dir=apps/learn/dist --filter=@quantumcomputinginc/learn --functions=netlify/functions --alias=data-preview-${{ github.event.number }} --message="PR Preview ${{ github.event.number }} By ${{ github.actor }}"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PREVIEW_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Detect changed files
      - name: List changes to generate URLs
        id: list_changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ github.event.pull_request.number }}
          owner=${{ github.repository_owner }}
          repo=$(echo ${{ github.repository }} | cut -d'/' -f2)
          files=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$owner/$repo/pulls/$pr_number/files" \
            | jq -r '.[] | select(.status == "added" or .status == "modified") | .filename' | paste -sd ",")
          echo "PREVIEW_URLS=$files" >> $GITHUB_ENV
      # End Output URL
      - name: Add deploy preview URL
        env:
          GITHUB_TOKEN: ${{ secrets.P_GITHUB_TOKEN }}
          PR_TYPE: data
        run: node ./.github/workflows/update-description.js
